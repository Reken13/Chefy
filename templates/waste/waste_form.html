{% extends "base/base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto space-y-5">
  <div class="flex items-center gap-3">
    <a href="{% url 'waste_list' %}" class="w-8 h-8 rounded-lg flex items-center justify-center transition-colors"
       style="background:var(--surface-2);color:var(--text-muted)">
      <i class="fas fa-arrow-left text-sm"></i>
    </a>
    <h1 class="text-xl font-bold" style="color:var(--text)">{{ title }}</h1>
  </div>
  <div class="ch-card p-6">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium mb-1.5" style="color:var(--text)">Ingrediente *</label>
        {{ form.ingredient }}
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1.5" style="color:var(--text)">Cantidad *</label>
          {{ form.quantity }}
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5" style="color:var(--text)">Motivo *</label>
          {{ form.reason }}
        </div>
        <div class="col-span-2">
          <label class="block text-sm font-medium mb-1.5" style="color:var(--text)">Fecha</label>
          {{ form.date }}
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5" style="color:var(--text)">Descripción adicional</label>
        {{ form.description }}
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="ch-btn-danger flex-1 justify-center py-2.5">
          <i class="fas fa-trash-alt mr-1.5"></i> Registrar Desperdicio
        </button>
        <a href="{% url 'waste_list' %}" class="ch-btn-secondary py-2.5 px-5">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
