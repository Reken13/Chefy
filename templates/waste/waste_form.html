{% extends "base/base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto space-y-5">
  <div class="flex items-center gap-3">
    <a href="{% url 'waste_list' %}" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"><i class="fas fa-arrow-left"></i></a>
    <h1 class="text-xl font-bold text-gray-900 dark:text-white">{{ title }}</h1>
  </div>
  <div class="card p-6">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Ingrediente *</label>
        {{ form.ingredient }}
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Cantidad *</label>
          {{ form.quantity }}
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Motivo *</label>
          {{ form.reason }}
        </div>
        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Fecha</label>
          {{ form.date }}
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Descripción adicional</label>
        {{ form.description }}
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="btn-danger flex-1 justify-center"><i class="fas fa-trash-alt"></i> Registrar Desperdicio</button>
        <a href="{% url 'waste_list' %}" class="btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
