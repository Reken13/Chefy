{% extends "base/base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto space-y-5">
  <div class="flex items-center gap-3">
    <a href="{% url 'purchase_list_index' %}" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"><i class="fas fa-arrow-left"></i></a>
    <h1 class="text-xl font-bold text-gray-900 dark:text-white">{{ title }}</h1>
  </div>
  <div class="card p-6">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Nombre *</label>
        {{ form.name }}
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Estado</label>
        {{ form.status }}
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Entrega esperada</label>
        {{ form.expected_delivery }}
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Notas</label>
        {{ form.notes }}
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="btn-primary flex-1 justify-center"><i class="fas fa-save"></i> Guardar</button>
        <a href="{% url 'purchase_list_index' %}" class="btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
