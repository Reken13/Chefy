{% if error %}
<div class="flex items-center gap-3 p-3 rounded-xl text-sm" style="background:rgba(239,68,68,0.08);color:#ef4444">
  <i class="fas fa-exclamation-circle flex-shrink-0"></i>
  <span>{{ error }}</span>
</div>
{% elif ingredient %}
<div class="flex items-center gap-3 p-3 rounded-xl text-sm animate-slide-up"
     style="background:rgba(34,197,94,0.08);color:var(--text)"
     x-data x-init="$dispatch('show-toast', {msg:'{{ ingredient.name }} {{ action }}', type:'success'})">
  <div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 text-green-500" style="background:rgba(34,197,94,0.12)">
    <i class="fas fa-{% if created %}plus{% else %}refresh{% endif %} text-xs"></i>
  </div>
  <div class="flex-1 min-w-0">
    <span class="font-semibold">{{ ingredient.name }}</span>
    <span class="ml-1.5" style="color:var(--text-muted)">{{ action }}</span>
    <span class="ml-1.5 ch-badge-green text-xs">{{ ingredient.current_stock|floatformat:2 }} {{ ingredient.unit }}</span>
    {% if ingredient.category %}
    <span class="ml-1 ch-badge-gray text-xs">{{ ingredient.category.name }}</span>
    {% endif %}
  </div>
  <a href="{% url 'adjust_stock' ingredient.pk %}" class="text-xs flex-shrink-0" style="color:var(--accent)">
    <i class="fas fa-pen"></i>
  </a>
</div>
{% endif %}
